events {}

http {
    # Docker's embedded DNS. Re-resolving per request is what spreads requests
    # across the api replicas, because compose gives them one name.
    resolver 127.0.0.11 valid=1s ipv6=off;

    access_log off;

    server {
        listen 8000;

        location / {
            set $upstream http://api:8000;
            proxy_pass $upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # An SSE stream must not be held in a buffer or the client sees
            # nothing until the response ends.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
    }
}
