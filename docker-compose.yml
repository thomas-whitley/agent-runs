services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_runs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_runs"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      ROLE: api
      DATABASE_URL: postgresql://agent:agent@db:5432/agent_runs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    restart: unless-stopped
    environment:
      ROLE: worker
      DATABASE_URL: postgresql://agent:agent@db:5432/agent_runs
      # The stub model needs no key and costs nothing. Set MODEL and
      # ANTHROPIC_API_KEY in .env to run the loop against Claude.
      MODEL: ${MODEL:-stub}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MAX_RUNS_PER_DAY: ${MAX_RUNS_PER_DAY:-20}
      POLL_SECONDS: "0.5"
    depends_on:
      db:
        condition: service_healthy
