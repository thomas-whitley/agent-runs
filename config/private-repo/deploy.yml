# .github/workflows/deploy.yml in the private mercury-config repo.
# Deploys the pinned public image with this repo's mercury.yaml. Shape only;
# the resource names come from the public repo's infra/main.bicep outputs.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE: ghcr.io/thomas-whitley/mercury:v0.2.0   # bumped by hand, never latest
  RESOURCE_GROUP: agent-runs
  API_APP: agent-runs-api
  WORKER_APP: agent-runs-worker
  SCHEDULER_JOB: agent-runs-scheduler

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse a floating tag
        run: |
          case "$IMAGE" in *:latest|*[!:]) echo "IMAGE must carry a pinned tag" >&2; exit 1;; esac

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Put the config where the apps read it
        run: |
          # The config is small, so it travels as one secret and the image
          # writes it to /config/mercury.yaml at start. No storage account.
          CONFIG_B64=$(base64 -w0 mercury.yaml)
          for app in "$API_APP" "$WORKER_APP"; do
            az containerapp secret set -g "$RESOURCE_GROUP" -n "$app" \
              --secrets mercury-config="$CONFIG_B64" \
                        telegram-bot-token="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
                        telegram-webhook-secret="${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" \
                        mercury-bearer-token="${{ secrets.MERCURY_BEARER_TOKEN }}" \
                        mercury-github-token="${{ secrets.MERCURY_GITHUB_TOKEN }}" \
                        gemini-api-key="${{ secrets.GEMINI_API_KEY }}" \
                        anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}" \
                        database-url="${{ secrets.DATABASE_URL }}"
          done
          az containerapp job secret set -g "$RESOURCE_GROUP" -n "$SCHEDULER_JOB" \
            --secrets mercury-config="$CONFIG_B64" \
                      mercury-bearer-token="${{ secrets.MERCURY_BEARER_TOKEN }}"

      - name: Update the apps and the job to the pinned image
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n "$API_APP" --image "$IMAGE"
          az containerapp update -g "$RESOURCE_GROUP" -n "$WORKER_APP" --image "$IMAGE"
          az containerapp job update -g "$RESOURCE_GROUP" -n "$SCHEDULER_JOB" --image "$IMAGE"

      - name: Register the webhook against the deployed URL
        run: |
          FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            --data-urlencode "url=https://$FQDN/telegram" \
            --data-urlencode "secret_token=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" \
            --data-urlencode "allowed_updates=[\"message\",\"callback_query\"]" >/dev/null

      - name: Smoke
        run: |
          FQDN=$(az containerapp show -g "$RESOURCE_GROUP" -n "$API_APP" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error "https://$FQDN/health" | grep -q '"status":"ok"'
