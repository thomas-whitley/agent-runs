# The only workflow that deploys. It runs the public repo's Bicep, checked out
# at the pinned commit, with the image built from that same commit and this
# repo's mercury.yaml. The public repo only builds and publishes images, so a
# public push changes nothing live until PUBLIC_SHA is bumped here.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # Bumped by hand, never a branch or latest. A full commit SHA from the public
  # repo whose Publish workflow has pushed the matching image tag.
  PUBLIC_SHA: b50186152fa7b234020e5919088ad877df04a4fe
  PUBLIC_REPO: thomas-whitley/agent-runs
  RESOURCE_GROUP: agent-runs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse anything but a full commit SHA
        run: |
          if ! printf '%s' "$PUBLIC_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "PUBLIC_SHA must be a 40 character commit SHA, not '$PUBLIC_SHA'" >&2
            exit 1
          fi

      - name: Check out the public repo at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PUBLIC_REPO }}
          ref: ${{ env.PUBLIC_SHA }}
          path: public

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the pinned Bicep with the pinned image and this config
        id: bicep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL: ${{ vars.MODEL || 'stub' }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          MERCURY_BEARER_TOKEN: ${{ secrets.MERCURY_BEARER_TOKEN }}
        run: |
          # The Bicep sends each app's full secret list, so a missing secret
          # here would remove it from the live apps rather than leave it alone.
          for name in DATABASE_URL MODEL_API_KEY MERCURY_BEARER_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "the Actions secret ${name} is not set" >&2
              exit 1
            fi
          done
          export IMAGE="ghcr.io/${PUBLIC_REPO}:${PUBLIC_SHA}"
          export MERCURY_CONFIG_B64="$(base64 -w0 mercury.yaml)"
          url="$(./public/infra/deploy.sh)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed ${IMAGE} to ${url}"

      - name: Smoke
        run: |
          url="${{ steps.bicep.outputs.url }}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 20 "${url}/health" | grep -q '"status":"ok"'; then
              echo "health ok after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "the api never answered /health" >&2
          exit 1
