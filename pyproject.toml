[project]
name = "agent-runs"
version = "0.1.0"
description = "A FastAPI agent loop that streams its steps over SSE and resumes after a dropped connection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "azure-monitor-opentelemetry>=1.6",
    "fastapi>=0.115",
    "openai>=1.60",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "psycopg[binary,pool]>=3.2",
    "pytest>=8.3",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "httpx2>=2.13.0",
    "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration tests need the compose stack, so they are opt in.
addopts = "-q -m 'not integration'"
markers = ["integration: needs a running docker compose stack"]
filterwarnings = [
    "error",
    # starlette references a deprecated anyio alias at import time. Upstream, not ours.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
