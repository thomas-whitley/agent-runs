# Builds and publishes the image and deploys nothing. The private config repo
# runs this repo's Bicep at a commit it pins, with the image tagged with that
# commit, so a push here changes nothing live until that pin is bumped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # The two replica proof runs against compose on every deploy, because it is
  # free here and costs an Azure replica otherwise.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up --build --detach --wait

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Two replicas serve one run
        env:
          AGENT_RUNS_BASE_URL: http://localhost:8000
          AGENT_RUNS_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_runs
        run: uv run pytest -m integration -o addopts= -v

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The default docker driver cannot export a cache, which the gha cache needs.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tag
        id: meta
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }},${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
