name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # The two replica proof runs against compose on every deploy, because it is
  # free here and costs an Azure replica otherwise.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up --build --detach --wait

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Two replicas serve one run
        env:
          AGENT_RUNS_BASE_URL: http://localhost:8000
          AGENT_RUNS_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_runs
        run: uv run pytest -m integration -o addopts= -v

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      # The default docker driver cannot export a cache, which the gha cache needs.
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tag
        id: meta
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }},${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # Skipped until the OIDC secrets exist, so a push never fails on a repo
    # that has not been wired to Azure yet.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the Bicep template
        id: bicep
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL: ${{ vars.MODEL || 'stub' }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          MERCURY_BEARER_TOKEN: ${{ secrets.MERCURY_BEARER_TOKEN }}
          MERCURY_CONFIG_B64: ${{ secrets.MERCURY_CONFIG_B64 }}
        run: |
          url="$(./infra/deploy.sh)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${url}"

      - name: Smoke test the live URL
        run: |
          url="${{ steps.bicep.outputs.url }}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "${url}/health" | grep -q '"status":"ok"'; then
              echo "health ok after ${attempt} attempt(s)"
              exit 0
            fi
            echo "waiting for a cold start, attempt ${attempt}"
            sleep 10
          done
          echo "the deployed app never answered /health" >&2
          exit 1
