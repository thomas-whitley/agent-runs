name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_runs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_runs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Its own database, created by the fixtures. Never the one a worker polls.
      TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_runs_test

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up --build --detach --wait

      - name: Health endpoint answers through the published port
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Two replicas serve one run
        env:
          AGENT_RUNS_BASE_URL: http://localhost:8000
          TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_runs
        run: uv run pytest -m integration -o addopts= -v

      - name: Show the stack's logs on failure
        if: failure()
        run: docker compose logs --tail 50

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
