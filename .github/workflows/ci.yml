name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_runs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_runs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Its own database, created by the fixtures. Never the one a worker polls.
      TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_runs_test

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  # checks/ is its own npm project with no workspace. Lighthouse is stubbed in
  # these tests, so no Chrome is needed here.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checks
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: checks/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

  # web/ is the runs page, its own npm project like checks/. The image builds
  # it again in its Node stage; this job is where a type error or a failing
  # component test shows up.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

  compose:
    runs-on: ubuntu-latest
    env:
      # A short window so the fallback test takes seconds, and a PageSpeed
      # endpoint where nothing listens, so it never calls Google.
      CHECK_CLAIM_WINDOW: "20"
      PAGESPEED_URL: http://127.0.0.1:9/runPagespeed
    steps:
      - uses: actions/checkout@v5

      # A throwaway token for this job's stack only, never stored anywhere.
      - name: Make a bearer token for the stack
        run: echo "MERCURY_BEARER_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build and start the stack
        run: docker compose up --build --detach --wait

      - name: Build the checks worker image
        run: docker compose --profile checks build checks

      - name: Health endpoint answers through the published port
        run: |
          curl --fail --silent --show-error http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Two replicas, and checks on the self hosted worker and the cloud fallback
        env:
          AGENT_RUNS_BASE_URL: http://localhost:8000
          AGENT_RUNS_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_runs
        run: uv run pytest -m integration -o addopts= -v -s

      - name: Show the stack's logs on failure
        if: failure()
        run: docker compose logs --tail 50

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
